<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Arshia Khaleghi — Digital Engineer. Web, AI, creative technology and security-minded engineering.">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Arshia Khaleghi — Digital Engineer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c;font-family:Vazirmatn,IRANSansX,IRANSans,Segoe UI,Tahoma,Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0}.ari{position:fixed;z-index:99;left:22px;bottom:22px;width:min(340px,calc(100vw - 44px));direction:rtl;color:#f6f6f3;pointer-events:none}.ariBox{pointer-events:auto;position:relative;padding:16px 17px 15px;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(145deg,#11141ddd,#090b10e8);backdrop-filter:blur(24px) saturate(140%);box-shadow:0 24px 80px #000a,0 0 45px #7c62ff18;transform:translateY(14px) scale(.97);opacity:0;transition:.4s cubic-bezier(.2,.8,.2,1)}.ari.open .ariBox{transform:none;opacity:1}.ariTop{display:flex;align-items:center;gap:10px;margin-bottom:9px}.ariAvatar{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#fff 0%,#c8b8ff 48%,#7c62ff 100%);color:#08090c;font-weight:950;box-shadow:0 0 26px #a982ff55;position:relative}.ariAvatar:after{content:"";position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:#57d99a;border:2px solid #0b0d12}.ariName{font-weight:950;font-size:12px;letter-spacing:.01em}.ariStatus{font-size:10px;color:#77e1ab;margin-top:2px}.ariText{margin:0;color:#d0d3da;font-size:12px;line-height:1.95}.ariClose{position:absolute;top:8px;left:9px;border:0;background:transparent;color:#777d89;cursor:pointer;font-size:18px;line-height:1}.ariClose:hover{color:#fff}.ariLinks{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.ariLinks a{font-size:10px;padding:7px 10px;border:1px solid #ffffff17;border-radius:10px;color:#c4c8d1;text-decoration:none;background:#ffffff06;transition:.2s}.ariLinks a:hover{color:#fff;background:#ffffff10;transform:translateY(-1px)}.ariBubble{pointer-events:auto;position:absolute;right:0;bottom:0;width:52px;height:52px;border:1px solid #ffffff25;border-radius:17px;background:linear-gradient(145deg,#171b26,#0c0f16);color:#fff;cursor:pointer;box-shadow:0 14px 50px #000a;display:grid;place-items:center;font-size:21px;transition:.25s cubic-bezier(.2,.8,.2,1)}.ari.open .ariBubble{transform:translateY(70px) scale(.9);opacity:.4}.ariBubble:hover{transform:translateY(-4px) scale(1.03)}.hint{position:fixed;z-index:98;left:23px;bottom:86px;color:#777e8c;font-size:9px;opacity:.85;pointer-events:none}.sectionPulse{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;transition:opacity .35s;background:radial-gradient(circle at 12% 85%,#a982ff12,transparent 28%)}@media(max-width:600px){.ari{left:12px;bottom:12px;width:calc(100vw - 24px)}.ariBox{padding:14px}.hint{display:none}}
</style>
</head>
<body>
<div class="sectionPulse" id="pulse" aria-hidden="true"></div>
<iframe src="./index.v2.html" title="Arshia Khaleghi — Digital Engineer" loading="eager" name="portfolio"></iframe>
<div class="hint">Ari is here if you get lost ✦</div>
<aside class="ari" id="ari" aria-label="Ari portfolio assistant">
<div class="ariBox"><button class="ariClose" id="close" aria-label="بستن">×</button><div class="ariTop"><div class="ariAvatar">A</div><div><div class="ariName">Ari · راهنمای کوچولو</div><div class="ariStatus">● آنلاین و حواس‌جمع</div></div></div><p class="ariText" id="ariText">سلام 👋 من Ari ـم! قول می‌دم اینجا براتون سخنرانی ۴۵ دقیقه‌ای درباره «چشم‌انداز سازمانی» برگزار نکنم 😂 اگه دنبال پروژه‌ها یا مهارت‌ها هستین، من راهو نشونتون می‌دم.</p><div class="ariLinks"><a href="#work" data-jump="work">پروژه‌ها 🚀</a><a href="#security" data-jump="security">امنیت 🔐</a><a href="#contact" data-jump="contact">ارتباط 👋</a></div></div>
<button class="ariBubble" id="bubble" aria-label="باز کردن Ari">🤖</button>
</aside>
<script>
(()=>{'use strict';
const frame=document.querySelector('iframe');
const a=document.getElementById('ari'),b=document.getElementById('bubble'),c=document.getElementById('close'),t=document.getElementById('ariText'),pulse=document.getElementById('pulse');
const baseMsgs={top:'سلام 👋 من Ari ـم! قول می‌دم اینجا براتون سخنرانی ۴۵ دقیقه‌ای درباره «چشم‌انداز سازمانی» برگزار نکنم 😂 اگه دنبال پروژه‌ها یا مهارت‌ها هستین، من راهو نشونتون می‌دم.',about:'اینجا خیلی خلاصه می‌فهمین ارشیا کیه و روی چه مدل مسئله‌هایی کار می‌کنه. رزومه‌خوانی اجباری نداریم 😄',work:'خب رسیدیم به قسمت مهم ماجرا 😎 اینجا بهتره به‌جای اینکه بگیم «خیلی خفنیم»، بذاریم خود پروژه‌ها حرف بزنن.',security:'اینجا بخش Security ـه 👀 نگاه امنیتی، دفاع و تست مجاز؛ نه فیلم هکری با صفحه سبز و صدای کیبورد 😂',lab:'اینجا می‌ریم زیر کاپوت؛ Performance، Accessibility و چیزایی که باعث می‌شن ظاهر خوب، پشتوانه فنی هم داشته باشه.',contact:'اگر تا اینجا اومدین، احتمالاً یه ایده یا پروژه توی ذهنتونه 👀 دکمه Contact هم الکی اینجا نیست 😏'};
let openState=false,lastKey='top';
function setText(key){if(!baseMsgs[key]||key===lastKey)return;lastKey=key;t.textContent=baseMsgs[key];pulse.style.opacity='.8';setTimeout(()=>pulse.style.opacity='0',380)}
function open(){openState=true;a.classList.add('open');if(lastKey==='top')t.textContent=baseMsgs.top}
function close(){openState=false;a.classList.remove('open')}
b.addEventListener('click',open);c.addEventListener('click',close);
document.querySelectorAll('[data-jump]').forEach(x=>x.addEventListener('click',e=>{e.preventDefault();try{const d=frame.contentDocument||frame.contentWindow.document;const el=d.getElementById(x.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});open()}catch(_){frame.contentWindow.location.hash=x.dataset.jump}}));
frame.addEventListener('load',()=>{
 try{
  const d=frame.contentDocument||frame.contentWindow.document;
  const head=d.head;
  if(!d.getElementById('ari-font')){const link=d.createElement('link');link.id='ari-font';link.rel='stylesheet';link.href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap';head.appendChild(link)}
  const style=d.createElement('style');style.textContent='body{font-family:Vazirmatn,Segoe UI,Tahoma,Arial,sans-serif!important}h1,h2,h3,.btn,.kicker,.eyebrow,.pmeta,.chip,.mode,.brand,.navlinks{font-family:"Space Grotesk",Vazirmatn,Segoe UI,sans-serif!important}p,.lead,.manifesto,.labCard{font-family:Vazirmatn,Segoe UI,Tahoma,Arial,sans-serif!important}';head.appendChild(style);
  const sections=[['about','about'],['work','work'],['security','security'],['lab','lab'],['contact','contact']];
  const onScroll=()=>{let best='top',score=Infinity;const y=d.documentElement.scrollTop||d.body.scrollTop;for(const [id,key] of sections){const el=d.getElementById(id);if(!el)continue;const dist=Math.abs(el.offsetTop-y-120);if(dist<score){score=dist;best=key}}if(openState)setText(best)};
  frame.contentWindow.addEventListener('scroll',onScroll,{passive:true});onScroll();
 }catch(_){ }
});
setTimeout(open,1000);
setTimeout(()=>{if(openState)setText('top')},1600);
})();
</script>
</body>
</html>
